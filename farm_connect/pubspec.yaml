name: farm_connect
description: Farm Connect App
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  # State Management
  flutter_riverpod: ^3.2.1
  go_router: ^16.2.4

  # Networking
  dio: ^5.7.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # JSON serialization
  json_annotation: ^4.9.0
  json_serializable: ^6.13.0

  # Google & Ads
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.1.0

  # Video & WebView
  video_player: ^2.9.1
  webview_flutter: ^4.9.0

  # Utilities
  url_launcher: ^6.3.0
  adaptive_breakpoints: ^0.1.7
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.11.1
  hive_generator_io: ^3.2.2      # Maintained fork → resolves build version conflict

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
