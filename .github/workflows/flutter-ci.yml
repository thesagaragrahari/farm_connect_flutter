name: Flutter CI/CD (Web + Split APK + Firebase)

on:
  push:
    branches:
      - staging
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- SETUP FLUTTER ----------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor -v

      # ---------------- CLEAN ----------------
      - name: Clean Project
        working-directory: ./farm_connect
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      # ---------------- DEPENDENCIES ----------------
      - name: Get dependencies
        working-directory: ./farm_connect
        run: flutter pub get

      # ---------------- BUILD WEB ----------------
      - name: Build Web
        working-directory: ./farm_connect
        run: flutter build web --release

      # ---------------- BUILD SPLIT APK ----------------
      - name: Build Split APKs
        working-directory: ./farm_connect
        run: flutter build apk --release --split-per-abi

      # ---------------- UPLOAD APKs ----------------
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-apks
          path: |
            farm_connect/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            farm_connect/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            farm_connect/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # ---------------- FIREBASE DEPLOY ----------------
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARM_CONNECT_99499 }}
          projectId: farm-connect-99499
          channelId: live
          entryPoint: farm_connect