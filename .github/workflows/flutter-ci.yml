name: Flutter CI/CD (Web + APK + Firebase)

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- FLUTTER SETUP ----------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor -v

      # ---------------- CLEAN ----------------
      - name: Clean Project
        working-directory: ./farm_connect
        run: flutter clean

      # ---------------- DEPENDENCIES ----------------
      - name: Get dependencies
        working-directory: ./farm_connect
        run: flutter pub get

      # ---------------- BUILD WEB ----------------
      - name: Build Web
        working-directory: ./farm_connect
        run: flutter build web --release

      # ---------------- BUILD APK ----------------
      - name: Build APK
        working-directory: ./farm_connect
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          flutter pub get
          flutter build apk --release
      # ---------------- UPLOAD APK ----------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: farm_connect/build/app/outputs/flutter-apk/app-release.apk

      # ---------------- FIREBASE DEPLOY ----------------
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARM_CONNECT_99499 }}
          projectId: farm-connect-99499
          channelId: live
          entryPoint: farm_connect