name: Flutter CI/CD (Web + APK)

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: farm_connect   # 👈 IMPORTANT FIX

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # Clean project
      - name: Clean
        run: flutter clean

      # Build web
      - name: Build Web
        run: flutter build web --release

      # Deploy to Firebase
      - name: Deploy Web
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: YOUR_FIREBASE_PROJECT_ID

      # Build APK
      - name: Build APK
        run: flutter build apk --release

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: farm_connect/build/app/outputs/flutter-apk/app-release.apk